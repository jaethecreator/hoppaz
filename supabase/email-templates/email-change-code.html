<!-- Supabase dashboard: Authentication, Emails, "Change email address" template. Subject: Your Hoppaz code is {{ .Token }}
     This is the one a guest gets when they add their email, so everything they did as a guest stays with them. -->
<div style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;max-width:420px;margin:0 auto;padding:24px;color:#1a1a1a">
  <p style="font-size:16px;margin:0 0 12px">Almost in. Here is your Hoppaz code.</p>
  <p style="font-size:40px;letter-spacing:8px;font-weight:700;margin:16px 0;font-family:ui-monospace,Menlo,Consolas,monospace">{{ .Token }}</p>
  <p style="font-size:14px;color:#555;margin:0 0 8px">Type it into Hoppaz to save this email to your account. It works for one hour.</p>
  <p style="font-size:14px;color:#555;margin:0">Did not ask for this? Ignore this email. Nothing changes.</p>
</div>
